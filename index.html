<!DOCTYPE html>
<html>
<head>
  <title>Zel Games</title>
  <style>
    body {
      background: #0f0f13;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
      text-align: center;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }
    .tagline {
      color: #aaa;
      margin-bottom: 50px;
    }
    .games {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .card {
      background: #1c1c24;
      border-radius: 12px;
      padding: 20px;
      width: 220px;
      transition: 0.2s;
    }
    .card:hover {
      transform: scale(1.05);
      background: #252530;
    }
    .card a {
      color: #7dd3fc;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Zel Games</h1>
  <p class="tagline">Play Free. No Downloads.</p>

  <div class="games">
    <div class="card">
      <h3>Overdrive City</h3>
      <p>Open world driving</p>
      <a href="https://appleweiping.github.io/overdrive-city/" target="_blank">Play</a>
    </div>

    <div class="card">
      <h3>OpenRoad</h3>
      <p>Free roam driving</p>
      <a href="https://gravityst.github.io/OpenRoad/" target="_blank">Play</a>
    </div>

    <!-- Add more cards here later -->
  </div>
</body>
</html>
